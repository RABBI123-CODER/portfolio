<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Action - Hero Section</title>
    <link rel="stylesheet" href="tem.css">
</head>
<body>

    <section class="hero-container">
        <!-- Background Overlay & Image -->
        <div class="bg-image"></div>
        <div class="overlay"></div>

        <!-- Header / Navigation -->
        <header class="navbar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                    <path d="M4 4h4v6H4V4zm12 0h4v16h-4V4zM4 14h4v6H4v-6zM10 9h4v6h-4V9z"/>
                </svg>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-link active">Index</a>
                <a href="#" class="nav-link">Works</a>
                <a href="#" class="nav-link">Studio</a>
                <a href="#" class="nav-link">Archive</a>
                <a href="#" class="nav-link">Contact</a>
            </nav>

            <a href="#" class="btn-get-started">Get Started</a>
        </header>

        <!-- Main Content Area -->
        <div class="hero-content">
            <div class="title-group">
                <h1 class="main-title">Neo Action</h1>
                <div class="slider-numbers">
                    <span class="num active">01.</span>
                    <span class="num">02.</span>
                    <span class="num">03.</span>
                </div>
            </div>

            <div class="meta-right">
                <span class="year">2026</span>
                <span class="category">Photography</span>
            </div>
        </div>

        <!-- Footer / Navigation Controls -->
        <footer class="hero-footer">
            <div class="footer-left">
                <div class="progress-line"></div>
                <span class="drag-text">Drag to Explore</span>
            </div>

            <div class="footer-center">
                <button class="nav-btn">&larr;</button>
                <span>Navigate</span>
                <button class="nav-btn">&rarr;</button>
            </div>

            <div class="footer-right">
                <span>Featured Project</span>
            </div>
        </footer>
    </section>

    <section class="hero-section">
  <div class="text-wrapper">
    <h1 class="reveal-text">A solution</h1>
  </div>
  <div class="text-wrapper">
    <h1 class="reveal-text">that goes above</h1>
  </div>
  <div class="text-wrapper">
    <h1 class="reveal-text">touch and</h1>
  </div>
  <div class="text-wrapper">
    <h1 class="reveal-text">imagination...</h1>
  </div>
</section>

</body>
</html>
